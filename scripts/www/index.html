        function updateEquationBoard(stage) {
            const board = document.getElementById('equation-board');
            const eq1 = document.getElementById('eq-step1');
            const eq2 = document.getElementById('eq-step2');
            const eq3 = document.getElementById('eq-step3');
            const cfg = CONFIGS[currentSubstance];

            if (currentMode !== 'mix') { 
                if (animationMode !== 'IONIZATION_PLAYING' && currentMode !== 'ionization') {
                    board.classList.add('hidden'); 
                }
                return; 
            }
            board.classList.remove('hidden');
            board.classList.remove('border-t-purple-500', 'shadow-[0_0_30px_rgba(168,85,247,0.2)]');
            board.classList.add('border-t-cyan-400', 'shadow-[0_0_30px_rgba(34,211,238,0.2)]');
            
            document.getElementById('eq-content-wrapper').style.maxHeight = '600px';
            document.getElementById('eq-content-wrapper').style.opacity = '1';
            document.getElementById('eq-toggle-icon').style.transform = 'rotate(0deg)';

            if (stage === 1) {
                eq1.innerHTML = cfg.eq1;
                eq2.style.height = '0'; eq2.style.opacity = '0'; eq2.style.marginTop = '0';
                eq3.style.height = '0'; eq3.style.opacity = '0'; eq3.style.marginTop = '0';
            } else if (stage === 2) {
                eq2.innerHTML = cfg.eq2;
                // 因字号调大，高度也做了相应微调以防止被裁剪
                eq2.style.height = '32px'; eq2.style.opacity = '1'; eq2.style.marginTop = '8px';
            } else if (stage === 3) {
                const targets = eq2.querySelectorAll('.spectator-target');
                targets.forEach(t => t.classList.add('spectator-crossed'));
                
                setTimeout(() => {
                    eq3.innerHTML = cfg.eq3;
                    eq3.style.height = '42px'; eq3.style.opacity = '1'; eq3.style.marginTop = '8px';
                }, 800);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta(); controls.update();
            const cfg = CONFIGS[currentSubstance];

            if (animationMode === 'DEMO') {
                demoGroup.children.forEach(group => { 
                    if (group.isIonGroup || group.isMoleculeGroup) { group.rotation.y += 0.01; group.rotation.x += 0.005; } 
                });
            }

            if (animationMode === 'DISSOLVING' || currentMode === 'mix' || animationMode === 'IONIZATION_PLAYING') {
                ambientWater.forEach(wm => {
                    if (!wm.isAssigned) {
                        wm.velocity.add(new THREE.Vector3((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02));
                        if(wm.group.position.x > 16) wm.velocity.x -= 0.05;
                        if(wm.group.position.x < -16) wm.velocity.x += 0.05;
                        if(wm.group.position.y > 9) wm.velocity.y -= 0.05;
                        if(wm.group.position.y < -9) wm.velocity.y += 0.05;
                        
                        wm.velocity.multiplyScalar(0.96); wm.group.position.add(wm.velocity);
                        wm.group.rotateX(wm.rotSpeed.x); wm.group.rotateY(wm.rotSpeed.y);
                    }
                });
            }

            if (currentMode === 'mix' && animationMode !== 'IDLE') {
                if (animationMode === 'MIXING' && partitionMesh.position.y < 25) {
                    partitionMesh.position.y += delta * 15;
                }
                
                const linesPos = [];

                ions.forEach(ion => {
                    if (ion.isLocked) return;
                    
                    if (animationMode === 'PRECIPITATING' && ion.targetPos) {
                        let diff = new THREE.Vector3().subVectors(ion.targetPos, ion.group.position);
                        let dist = diff.length();
                        ion.velocity.add(diff.normalize().multiplyScalar(0.005));
                        ion.velocity.add(new THREE.Vector3((Math.random()-0.5)*0.015, (Math.random()-0.5)*0.015, (Math.random()-0.5)*0.015)); 
                        ion.velocity.multiplyScalar(0.90);
                        
                        if (dist < 0.3) {
                            ion.group.position.copy(ion.targetPos);
                            ion.velocity.set(0,0,0);
                            ion.isLocked = true;
                            ion.hydrationShell.forEach(water => {
                                const worldPos = new THREE.Vector3();
                                water.getWorldPosition(worldPos);
                                scene.add(water);
                                water.position.copy(worldPos);
                                ambientWater.push({
                                    group: water, isAssigned: false,
                                    velocity: new THREE.Vector3((Math.random()-0.5)*0.3, 0.3+Math.random()*0.3, (Math.random()-0.5)*0.3),
                                    rotSpeed: new THREE.Vector3(0.1, 0.1, 0)
                                });
                            });
                            ion.hydrationShell = [];
                        }

                        const matNode = ion.group.userData.materialNode;
                        if(matNode && matNode.material) {
                            if (cfg.spectators && cfg.spectators.includes(ion.id)) {
                                matNode.material.transparent = true;
                                matNode.material.opacity = THREE.MathUtils.lerp(matNode.material.opacity, 0.15, 0.05);
                                matNode.material.roughness = 1.0;
                                if(ion.signSprite) ion.signSprite.material.opacity = THREE.MathUtils.lerp(ion.signSprite.material.opacity, 0.05, 0.05);
                            } else if (cfg.reacting && cfg.reacting.includes(ion.id)) {
                                matNode.material.emissive.setHex(ion.def.color);
                                matNode.material.emissiveIntensity = THREE.MathUtils.lerp(matNode.material.emissiveIntensity, 0.6, 0.05);
                                
                                if(ion.def.type === 'Cation' && !ion.isLocked && Math.random() > 0.3) {
                                    let closestDist = 8, closestPos = null;
                                    ions.forEach(other => {
                                        if(other.def.type === 'Anion' && !other.isLocked && cfg.reacting.includes(other.id)) {
                                            let d = ion.group.position.distanceTo(other.group.position);
                                            if(d < closestDist) { closestDist = d; closestPos = other.group.position; }
                                        }
                                    });
                                    if(closestPos) linesPos.push(ion.group.position.x, ion.group.position.y, ion.group.position.z, closestPos.x, closestPos.y, closestPos.z);
                                }
                            }
                        }

                    } else {
                        let speed = animationMode === 'MIXING' ? 0.06 : 0.015;
                        ion.velocity.add(new THREE.Vector3((Math.random()-0.5)*speed, (Math.random()-0.5)*speed, (Math.random()-0.5)*speed));
                        
                        const boundX = 16.5, boundY = 9, boundZ = 7.5;
                        if(animationMode === 'REACTION_IDLE') {
                            if(ion.basePos.x < 0 && ion.group.position.x > -1.5) ion.velocity.x -= 0.05; 
                            if(ion.basePos.x > 0 && ion.group.position.x < 1.5) ion.velocity.x += 0.05;
                        }
                        if(ion.group.position.x > boundX) ion.velocity.x -= 0.05;
                        if(ion.group.position.x < -boundX) ion.velocity.x += 0.05;
                        if(ion.group.position.y > boundY) ion.velocity.y -= 0.05;
                        if(ion.group.position.y < -boundY) ion.velocity.y += 0.05;
                        if(ion.group.position.z > boundZ) ion.velocity.z -= 0.05;
                        if(ion.group.position.z < -boundZ) ion.velocity.z += 0.05;
                        
                        ions.forEach(other => {
                            if(other !== ion && !other.isLocked) {
                                let dVec = new THREE.Vector3().subVectors(ion.group.position, other.group.position);
                                let dSq = dVec.lengthSq();
                                if(dSq > 0.1 && dSq < 4.0) ion.velocity.add(dVec.normalize().multiplyScalar(0.01 / Math.sqrt(dSq)));
                            }
                        });
                        ion.velocity.multiplyScalar(0.95);
                    }
                    ion.group.position.add(ion.velocity);
                });
                
                attractionLines.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linesPos, 3));
            }

            if (animationMode === 'DISSOLVING' && currentMode === 'pure') {
                dissolveProgress += delta;
                let newIons = [];

                ions.forEach(ion => {
                    if (ion.isMolecule) {
                        ion.velocity.add(new THREE.Vector3((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02));
                        if(ion.group.position.length() > 15) ion.velocity.add(ion.group.position.clone().normalize().multiplyScalar(-0.02));
                        ion.velocity.multiplyScalar(0.95); ion.group.position.add(ion.velocity);
                        ion.group.rotateX(0.02); ion.group.rotateY(0.02);

                        // --- 新增：未电离的醋酸分子逐渐变暗，沉入背景，突出动态平衡的视觉效果 ---
                        if (ion.id === 'CH3COOH' && dissolveProgress > 1.5) {
                            ion.group.children.forEach(c => {
                                if (c.material) {
                                    c.material.transparent = true;
                                    c.material.opacity = THREE.MathUtils.lerp(c.material.opacity, 0.15, 0.02);
                                }
                            });
                        }
                        
                        // --- 新增：未电离的水分子变得微透明，呈现宏观流体的视觉背景 ---
                        if (ion.id === 'H2O' && dissolveProgress > 1.5) {
                            ion.group.children.forEach(c => {
                                if (c.material) {
                                    c.material.transparent = true;
                                    c.material.opacity = THREE.MathUtils.lerp(c.material.opacity, 0.5, 0.02);
                                }
                            });
                        }

                        if (dissolveProgress > 2.0 && !ion.ionized) {
                            if (ion.id === 'HCl') {
                                ion.ionized = true; scene.remove(ion.group);
                                newIons.push(
                                    { id: 'H+', def: ION_TYPES['H+'], group: createIonMesh('H+'), velocity: new THREE.Vector3(0.1,0.1,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false },
                                    { id: 'Cl-', def: ION_TYPES['Cl-'], group: createIonMesh('Cl-'), velocity: new THREE.Vector3(-0.1,-0.1,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false }
                                );
                                newIons[newIons.length-2].group.position.copy(ion.group.position);
                                newIons[newIons.length-1].group.position.copy(ion.group.position).add(new THREE.Vector3(1,0,0));
                            } else if (ion.id === 'NH3' && Math.random() < 0.05) { 
                                ion.ionized = true; scene.remove(ion.group);
                                newIons.push(
                                    { id: 'NH4+', def: ION_TYPES['NH4+'], group: createIonMesh('NH4+'), velocity: new THREE.Vector3(0.1,0,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false },
                                    { id: 'OH-', def: ION_TYPES['OH-'], group: createIonMesh('OH-'), velocity: new THREE.Vector3(-0.1,0,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false }
                                );
                                newIons[newIons.length-2].group.position.copy(ion.group.position);
                                newIons[newIons.length-1].group.position.copy(ion.group.position).add(new THREE.Vector3(1,0,0));
                            } else if (ion.id === 'CH3COOH' && Math.random() < 0.05) { 
                                // 动态平衡：限制同时存在的离子对数量，为复合留出空间
                                let ch3cooCount = ions.filter(i => i.id === 'CH3COO-' && !i.ionized).length + newIons.filter(i => i.id === 'CH3COO-').length;
                                if (ch3cooCount < 4) { // 稍微增加一点数量让动态平衡更明显
                                    ion.ionized = true; scene.remove(ion.group);
                                    newIons.push(
                                        { id: 'H+', def: ION_TYPES['H+'], group: createIonMesh('H+'), velocity: new THREE.Vector3(0.1,0.1,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false, recombining: false },
                                        { id: 'CH3COO-', def: ION_TYPES['CH3COO-'], group: createIonMesh('CH3COO-'), velocity: new THREE.Vector3(-0.1,-0.1,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false, recombining: false }
                                    );
                                    newIons[newIons.length-2].group.position.copy(ion.group.position);
                                    newIons[newIons.length-1].group.position.copy(ion.group.position).add(new THREE.Vector3(1,0,0));
                                }
                            } else if (ion.id === 'H2O' && Math.random() < 0.02) { 
                                // 水分子极弱电离动态平衡：控制 H+ 和 OH- 非常稀少
                                let ohCount = ions.filter(i => i.id === 'OH-' && !i.ionized).length + newIons.filter(i => i.id === 'OH-').length;
                                if (ohCount < 3) { 
                                    ion.ionized = true; scene.remove(ion.group);
                                    newIons.push(
                                        { id: 'H+', def: ION_TYPES['H+'], group: createIonMesh('H+'), velocity: new THREE.Vector3(0.1,0.1,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false, recombining: false },
                                        { id: 'OH-', def: ION_TYPES['OH-'], group: createIonMesh('OH-'), velocity: new THREE.Vector3(-0.1,-0.1,0), isDetached: true, isDissolvable: true, basePos: ion.group.position.clone(), isNonElectrolyte: false, recombining: false }
                                    );
                                    newIons[newIons.length-2].group.position.copy(ion.group.position);
                                    newIons[newIons.length-1].group.position.copy(ion.group.position).add(new THREE.Vector3(1,0,0));
                                }
                            }
                        }
                    } else if (ion.isDissolvable) {
                        if (!ion.isDetached) {
                            const detachTime = 2.0 + (5 - ion.gridDist) * 1.0; 
                            if (dissolveProgress > detachTime - 1.5 && !ion.shellGathering) {
                                ion.shellGathering = true; ion.gatherTime = dissolveProgress;
                                ion.hydrationShellInfo = [];
                                if (ion.id !== 'OH-') {
                                    const rOffset = ion.isNonElectrolyte ? 1.2 : ion.def.radius+0.35;
                                    const targetPositions = [new THREE.Vector3(rOffset,0,0), new THREE.Vector3(-rOffset,0,0), new THREE.Vector3(0,rOffset,0), new THREE.Vector3(0,-rOffset,0)];
                                    targetPositions.forEach(pos => {
                                        let bestWater = ambientWater.find(aw => !aw.isAssigned);
                                        if(!bestWater) {
                                            const water = createWaterMolecule();
                                            water.position.set(Math.random() > 0.5 ? 18 : -18, (Math.random()-0.5)*15, (Math.random()-0.5)*10);
                                            scene.add(water);
                                            bestWater = { group: water, isAssigned: false, velocity: new THREE.Vector3(), rotSpeed: new THREE.Vector3() };
                                            ambientWater.push(bestWater);
                                        }
                                        bestWater.isAssigned = true; 
                                        ion.hydrationShellInfo.push({ aw: bestWater, start: bestWater.group.position.clone(), targetLocal: pos });
                                    });
                                }
                            }

                            if (ion.shellGathering) {
                                let localT = Math.min((dissolveProgress - ion.gatherTime) / 1.5, 1.0);
                                let easeT = localT * localT * (3 - 2 * localT);
                                ion.hydrationShellInfo.forEach(info => {
                                    info.aw.group.position.lerpVectors(info.start, ion.basePos.clone().add(info.targetLocal), easeT);
                                    info.aw.group.lookAt(ion.group.position);
                                    if(ion.isNonElectrolyte || ion.def.type === 'Cation') info.aw.group.rotateY(Math.PI);
                                });
                                ion.group.position.copy(ion.basePos).add(new THREE.Vector3((Math.random()-0.5)*0.1*easeT, 0, 0));
                                
                                if (dissolveProgress > detachTime) {
                                    ion.isDetached = true;
                                    ion.velocity = ion.basePos.clone().normalize().multiplyScalar(0.15);
                                    ion.hydrationShellInfo.forEach(info => {
                                        ion.group.add(info.aw.group); info.aw.group.position.copy(info.targetLocal);
                                        const dummy = new THREE.Object3D(); dummy.position.copy(info.targetLocal); dummy.lookAt(0,0,0);
                                        info.aw.group.quaternion.copy(dummy.quaternion);
                                        if (ion.isNonElectrolyte || ion.def.type === 'Cation') info.aw.group.rotateY(Math.PI);
                                        ion.hydrationShell.push(info.aw.group);
                                    });
                                }
                            }
                        } else {
                            ion.velocity.add(new THREE.Vector3((Math.random()-0.5)*0.015, (Math.random()-0.5)*0.015, (Math.random()-0.5)*0.015));
                            if (ion.isNonElectrolyte) { ion.group.rotation.x += 0.005; ion.group.rotation.y += 0.005; }
                            if (ion.group.position.length() > 20) ion.velocity.add(ion.group.position.clone().normalize().multiplyScalar(-0.01));
                            
                            // --- 新增：动态平衡复合逻辑 (针对游离的弱电解质离子对) ---
                            if ((currentSubstance === 'CH3COOH' || currentSubstance === 'H2O') && dissolveProgress > 3.0 && !ion.ionized) {
                                if (ion.recombining && ion.targetIon) {
                                    let dir = new THREE.Vector3().subVectors(ion.targetIon.group.position, ion.group.position);
                                    let dist = dir.length();
                                    ion.velocity.add(dir.normalize().multiplyScalar(0.015)); // 相互吸引
                                    
                                    // 相遇后瞬间复合
                                    if (dist < 0.6 && ion.id === 'H+') {
                                        ion.ionized = true; ion.targetIon.ionized = true; // 标记删除
                                        scene.remove(ion.group); scene.remove(ion.targetIon.group);
                                        
                                        // 生成一个新的分子（弱酸或水）
                                        let molGroup;
                                        let targetId;
                                        if (currentSubstance === 'CH3COOH') {
                                            molGroup = createCH3COOH(); targetId = 'CH3COOH';
                                        } else {
                                            molGroup = createWaterMolecule(); molGroup.scale.set(1.5, 1.5, 1.5); targetId = 'H2O';
                                        }
                                        molGroup.position.copy(ion.group.position);
                                        molGroup.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                                        newIons.push({
                                            id: targetId, group: molGroup, basePos: molGroup.position.clone(),
                                            velocity: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1),
                                            isDetached: true, isMolecule: true, shellGathering: false, hydrationShell: [], hydrationShellInfo: []
                                        });
                                    }
                                } else if (ion.id === 'H+' && Math.random() < 0.02) { // 随机触发复合意图
                                    let targetType = currentSubstance === 'CH3COOH' ? 'CH3COO-' : 'OH-';
                                    let freeTarget = ions.find(i => i.id === targetType && !i.recombining && !i.ionized);
                                    if (freeTarget) {
                                        ion.recombining = true; freeTarget.recombining = true;
                                        ion.targetIon = freeTarget; freeTarget.targetIon = ion;
                                    }
                                }
                            }

                            ion.velocity.multiplyScalar(0.95); ion.group.position.add(ion.velocity);
                        }
                    } else {
                        ion.group.position.copy(ion.basePos).add(new THREE.Vector3((Math.random()-0.5)*0.03, (Math.random()-0.5)*0.03, (Math.random()-0.5)*0.03));
                    }
                });

                if(newIons.length > 0) {
                    newIons.forEach(ni => scene.add(ni.group));
                    ions = ions.filter(i => !i.ionized).concat(newIons);
                }
            }

            if (animationMode === 'HEATING' && currentMode === 'pure') {
                meltTemperature += delta * 600; 
                const vibration = Math.min(meltTemperature / (cfg.meltTemp * 0.5), 0.3);
                ions.forEach(ion => {
                    if (ion.basePos) {
                        ion.group.position.copy(ion.basePos).add(
                            new THREE.Vector3((Math.random()-0.5)*vibration, (Math.random()-0.5)*vibration, (Math.random()-0.5)*vibration)
                        );
                    }
                });

                if (meltTemperature >= cfg.meltTemp) {
                    animationMode = 'MOLTEN';
                    if (cfg.isMolecularCrystal) {
                        updateStatusText("已达熔点！进入熔融态，分子间作用力被破坏，分子能够紧密流转滑动，但依然没有离子产生。", "text-purple-400 font-bold");
                    } else if (cfg.type === 'water') {
                        updateStatusText("已达熔点！固态冰融化为液态水。水分子能够自由滑动流转，但依然极少发生电离。", "text-blue-300 font-bold");
                    } else {
                        updateStatusText("已达熔点！进入熔融态，巨大的热能克服了晶格能，离子解开束缚，能够紧密流转滑动。", "text-red-400 font-bold");
                    }
                    ions.forEach(ion => {
                        ion.velocity = new THREE.Vector3((Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05);
                        ion.isDetached = true;
                    });
                }
            } else if (animationMode === 'MOLTEN' && currentMode === 'pure') {
                const SAFE_DIST = cfg.isMolecularCrystal ? 2.0 : 1.3;
                ions.forEach(ion => {
                    ion.velocity.add(new THREE.Vector3((Math.random()-0.5)*0.04, (Math.random()-0.5)*0.04, (Math.random()-0.5)*0.04));
                    
                    if (!isElectricFieldOn) {
                        // 未通电时，熔融离子聚拢在中心区域
                        if (ion.group.position.length() > 5) ion.velocity.add(ion.group.position.clone().normalize().multiplyScalar(-0.02));
                    } else {
                        // 通电时，解除X轴向心约束，允许向两极移动，仅约束YZ轴以防飞出视口
                        if (Math.abs(ion.group.position.y) > 5) ion.velocity.y -= Math.sign(ion.group.position.y) * 0.02;
                        if (Math.abs(ion.group.position.z) > 5) ion.velocity.z -= Math.sign(ion.group.position.z) * 0.02;
                    }
                    
                    ion.velocity.multiplyScalar(0.85); 
                    ion.group.position.add(ion.velocity);
                });
                for (let i = 0; i < ions.length; i++) {
                    for (let j = i + 1; j < ions.length; j++) {
                        let diff = new THREE.Vector3().subVectors(ions[i].group.position, ions[j].group.position);
                        let dist = diff.length();
                        if (dist < SAFE_DIST) {
                            let correction = diff.normalize().multiplyScalar((SAFE_DIST - dist) * 0.5);
                            ions[i].group.position.add(correction);
                            ions[j].group.position.sub(correction);
                        }
                    }
                }
            }

            let freeCharge = 0; 
            
            ions.forEach(ion => {
                if (ion.isDetached && !ion.isLocked && !ion.isMolecule && !ion.isNonElectrolyte) {
                    freeCharge += (ion?.def?.charge || 1);
                    
                    if (isElectricFieldOn) {
                        // 稍微增大电场引力。由于熔融状态下微粒间摩擦阻力较大，给予更大推力确保到达碳棒
                        const force = (animationMode === 'MOLTEN' ? 0.015 : 0.006) * (ion?.def?.charge || 1);
                        if (ion?.def?.type === 'Cation') { 
                            if (ion.group.position.x > -14.0) ion.velocity.x -= force;
                            else ion.velocity.x *= 0.5; // 在碳棒附近滞留
                        } else { 
                            if (ion.group.position.x < 14.0) ion.velocity.x += force;
                            else ion.velocity.x *= 0.5; // 在碳棒附近滞留
                        }
                    }
                } else if (isElectricFieldOn && !ion.isDetached && !ion.isMolecule && !ion.isNonElectrolyte) {
                    // 原有：固体中晶格内的电场微震动
                    const t = ion?.def?.type === 'Cation' ? -0.1 : 0.1;
                    if(ion.basePos) ion.group.position.copy(ion.basePos).add(new THREE.Vector3(t + (Math.random()-0.5)*0.05, 0, 0));
                }
            });

            updateChart(freeCharge);
            
            if (currentMode === 'ionization') {
                ions.forEach(i => {
                    if (i.isMolecule || i.isUnit) {
                        i.group.rotation.x += 0.005; i.group.rotation.y += 0.005;
                        i.group.position.copy(i.basePos).add(new THREE.Vector3(0, Math.sin(clock.getElapsedTime() * 2) * 0.2, 0));
                    }
                    if (i.jiggle) {
                        i.velocity.add(new THREE.Vector3((Math.random()-0.5)*0.015, (Math.random()-0.5)*0.015, (Math.random()-0.5)*0.015));
                        let dist = i.group.position.distanceTo(i.basePos);
                        if (dist > 1.5) i.velocity.add(i.basePos.clone().sub(i.group.position).normalize().multiplyScalar(0.01));
                        i.velocity.multiplyScalar(0.95);
                        i.group.position.add(i.velocity);
                    }
                });
                ambientWater.forEach(aw => {
                    aw.velocity.add(new THREE.Vector3((Math.random()-0.5)*0.01, (Math.random()-0.5)*0.01, (Math.random()-0.5)*0.01));
                    if (aw.group.position.length() > 10) aw.velocity.add(aw.group.position.clone().normalize().multiplyScalar(-0.005));
                });
            }

            renderer.render(scene, camera);
        }

        function spawnAmbientWater(count) {
            ambientWater.forEach(wm => scene.remove(wm.group)); ambientWater = [];
            document.body.classList.add('underwater');
            for(let i=0; i<count; i++) {
                const water = createWaterMolecule();
                water.position.set((Math.random()-0.5)*30, (Math.random()-0.5)*18, (Math.random()-0.5)*14);
                water.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                scene.add(water);
                ambientWater.push({
                    group: water, isAssigned: false,
                    velocity: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1),
                    rotSpeed: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1)
                });
            }
        }

        function startDissolving() {
            if (animationMode !== 'IDLE') resetSimulation(false);
            animationMode = 'DISSOLVING';
            dissolveProgress = 0;
            bondsGroup.visible = false;
            
            const cfg = CONFIGS[currentSubstance];
            if (cfg.type !== 'water') {
                spawnAmbientWater(25);
            } else {
                document.body.classList.add('underwater');
            }
            
            if (cfg.isMolecularCrystal) {
                updateStatusText("正在溶解：水分子包围蔗糖分子，破坏了分子间作用力。蔗糖以【完整分子】形式脱离晶体进入水中，分子内部共价键未破裂，没有离子生成！", "text-purple-300 font-bold");
            } else if (cfg.type === 'water') {
                updateStatusText("正在观察纯水：绝大多数水分子保持共价键结合的分子状态。只有极其微小的一部分发生自偶电离，产生 H⁺ 和 OH⁻，并处于动态平衡。", "text-blue-300 font-bold");
            } else if (cfg.isSoluble === false) {
                updateStatusText("晶格能极大，水分子极难将其拆散！仅有最外层极少数的离子能被拉出解离，绝大部分仍保持固体颗粒状。", "text-orange-400 font-bold");
            } else if (cfg.type === 'weak_acid') {
                updateStatusText("正在溶解：大量醋酸分子扩散到水中。由于它是弱电解质，仅有极少数发生电离（明亮），且生成的离子会不断重新结合成醋酸分子（变暗），形成【动态平衡】！", "text-blue-300 font-bold");
            } else {
                updateStatusText("正在溶解：溶液中原有的水分子做布朗运动靠近晶体。合力将离子从晶格中【拉出】。形成水合离子后在水中自由移动。", "text-cyan-300");
            }
        }

        function startMelting() {
            if (animationMode !== 'IDLE') resetSimulation(false);
            animationMode = 'HEATING';
            meltTemperature = currentSubstance === 'H2O' ? -50 : 0;
            bondsGroup.visible = false;
            if (CONFIGS[currentSubstance].isMolecularCrystal) {
                updateStatusText(`持续加热中... (目标熔点: ${CONFIGS[currentSubstance].meltTemp}℃)。热运动加剧，准备克服分子间作用力。`, "text-purple-400");
            } else if (CONFIGS[currentSubstance].type === 'water') {
                updateStatusText(`持续加热中... (目标熔点: ${CONFIGS[currentSubstance].meltTemp}℃)。冰的晶体结构准备解体。`, "text-blue-300");
            } else {
                updateStatusText(`持续加热中... (目标熔点: ${CONFIGS[currentSubstance].meltTemp}℃)。热运动加剧，准备克服晶格能。`, "text-orange-400");
            }
        }

        function assignPrecipitateTargets() {
            const cfg = CONFIGS[currentSubstance];
            
            const assignLatticeTargets = (cations, anions, spacing, basePos, ratioStr) => {
                let allIons = [...cations, ...anions];
                let count = allIons.length;
                let size = Math.ceil(Math.pow(count, 1/3)); 
                let slots = [];
                let cIndex = 0; let aIndex = 0;
                
                for(let y=0; y<size && slots.length < count; y++){
                    for(let x=0; x<size && slots.length < count; x++){
                        for(let z=0; z<size && slots.length < count; z++){
                            let isCation = false;
                            if (ratioStr === '1:1') isCation = (x+y+z) % 2 === 0;
                            else if (ratioStr === '1:2') isCation = (slots.length % 3 === 0);
                            
                            if (isCation && cIndex >= cations.length) isCation = false;
                            if (!isCation && aIndex >= anions.length) isCation = true;

                            let targetPos = new THREE.Vector3(
                                basePos.x + (x - size/2.0 + 0.5) * spacing,
                                basePos.y + y * spacing,
                                basePos.z + (z - size/2.0 + 0.5) * spacing
                            );
                            
                            if (isCation && cIndex < cations.length) {
                                cations[cIndex].targetPos = targetPos;
                                cIndex++; slots.push(targetPos);
                            } else if (!isCation && aIndex < anions.length) {
                                anions[aIndex].targetPos = targetPos;
                                aIndex++; slots.push(targetPos);
                            }
                        }
                    }
                }
            };

            if (cfg.name === 'CuSO4 + Ba(OH)2') {
                let ba = ions.filter(i => i.id === 'Ba2+' && !i.isLocked);
                let so4 = ions.filter(i => i.id === 'SO42-' && !i.isLocked);
                let cu = ions.filter(i => i.id === 'Cu2+' && !i.isLocked);
                let oh = ions.filter(i => i.id === 'OH-' && !i.isLocked);
                assignLatticeTargets(ba, so4, 1.6, new THREE.Vector3(-4, -9, 0), '1:1');
                assignLatticeTargets(cu, oh, 1.4, new THREE.Vector3(4, -9, 0), '1:2');
            } else if (cfg.reacting && cfg.reacting.length >= 2) {
                let cations = ions.filter(i => i.id === cfg.reacting[0] && !i.isLocked);
                let anions = ions.filter(i => i.id === cfg.reacting[1] && !i.isLocked);
                let ratio = cations.length === anions.length ? '1:1' : '1:2';
                assignLatticeTargets(cations, anions, 1.5, new THREE.Vector3(0, -9.5, 0), ratio);
            }
        }

        function startMixing() {
            if (animationMode !== 'REACTION_IDLE') return;
            animationMode = 'MIXING';
            const cfg = CONFIGS[currentSubstance];
            
            updateEquationBoard(2); 

            if (cfg.reacts) {
                updateStatusText("【混合溶解】方程裂开为全离子方程式。混合后，反应离子身上泛起光晕，旁观离子逐渐暗淡并透明。", "text-cyan-300 font-bold");
                setTimeout(() => {
                    assignPrecipitateTargets();
                    animationMode = 'PRECIPITATING';
                    updateEquationBoard(3); 
                    updateStatusText("【生成沉淀】反应离子结合沉降，导电率随之下降。方程中没有参与反应的旁观离子被红色叉号删去，留下净离子方程式！", "text-red-400 font-bold");
                }, 3500); 
            } else {
                updateStatusText("【自由混合与共存】所有离子自由游荡，未发现生成沉淀、气体或水的组合，因此只发生了物理混合，不发生化学反应。", "text-slate-400");
                setTimeout(() => updateEquationBoard(3), 2000);
            }
        }

        function toggleElectricField() {
            isElectricFieldOn = !isElectricFieldOn; electrodesGroup.visible = isElectricFieldOn; 
            const btn = document.getElementById('btn-efield');
            if (isElectricFieldOn) {
                document.getElementById('ammeter-ui').classList.remove('hidden');
                btn.innerText = '停止供电 (断开电路)'; btn.classList.replace('from-yellow-600', 'from-red-600');
            } else {
                document.getElementById('ammeter-ui').classList.add('hidden');
                btn.innerText = '外加电场 (测导电)'; btn.classList.replace('from-red-600', 'from-yellow-600');
            }
        }

        function showHydrationDemo() {
            resetSimulation(false); animationMode = 'DEMO'; bondsGroup.visible = false; partitionMesh.visible = false;
            ions.forEach(ion => ion.group.visible = false);
            if (isElectricFieldOn) toggleElectricField(); 
            while(demoGroup.children.length > 0) demoGroup.remove(demoGroup.children[0]);
            
            const cfg = CONFIGS[currentSubstance];

            if (cfg.isMolecularCrystal) {
                const group = createSucroseMesh(); group.isMoleculeGroup = true;
                group.scale.set(1.5, 1.5, 1.5);
                const r = 1.3;
                [new THREE.Vector3(r,0,0), new THREE.Vector3(-r,0.5,0), new THREE.Vector3(0,r,0), new THREE.Vector3(0,-r,0), new THREE.Vector3(0,0,r)].forEach(pos => {
                    const water = createWaterMolecule(); group.add(water); water.position.copy(pos);
                    const dummy = new THREE.Object3D(); dummy.position.copy(pos); dummy.lookAt(0,0,0);
                    water.quaternion.copy(dummy.quaternion); water.rotateY(Math.PI);
                });
                demoGroup.add(group);
                updateStatusText(`【特写模式】：蔗糖分子通过表面的极性基团(-OH)与水分子形成氢键而溶解。由于整个分子保持完整，没有解离出离子，因此是【非电解质】，不能导电！`, "text-purple-300 font-bold");
                camera.position.set(0, 0, 14); controls.target.set(0,0,0);
                return;
            } else if (cfg.type === 'weak_acid') {
                const group = createCH3COOH(); group.isMoleculeGroup = true;
                group.scale.set(1.5, 1.5, 1.5);
                demoGroup.add(group);
                updateStatusText(`【特写模式】：醋酸是典型的弱酸，绝大多数情况下它维持着原有的分子共价键结构，仅有极其微小的概率发生 O-H 键断裂释放出氢离子。`, "text-blue-300 font-bold");
                camera.position.set(0, 0, 14); controls.target.set(0,0,0);
                return;
            } else if (cfg.type === 'water') {
                const group = createWaterMolecule(); group.isMoleculeGroup = true;
                group.scale.set(2.5, 2.5, 2.5);
                demoGroup.add(group);
                updateStatusText(`【特写模式】：水分子通过极性共价键结合。通常状态下它极难发生断裂，只有极少数（约10⁻⁷）会自偶电离出 H⁺ 和 OH⁻，因此纯水极难导电。`, "text-cyan-300 font-bold");
                camera.position.set(0, 0, 14); controls.target.set(0,0,0);
                return;
            }

            const defC = ION_TYPES[cfg.c || 'Na+'];
            const defA = ION_TYPES[cfg.a || 'Cl-'];

            const createDemoIon = (ionId, def, xPos, isCation) => {
                const group = new THREE.Group(); group.isIonGroup = true; group.position.set(xPos, 0, 0);
                group.add(new THREE.Mesh(new THREE.SphereGeometry(def.radius, 32, 32), new THREE.MeshPhysicalMaterial({ color: def.color, roughness: 0.2, metalness: 0.2 })));
                group.add(createTextSprite(def.sign, 85));
                const r = def.radius + 0.35;
                if (ionId !== 'OH-') {
                    [new THREE.Vector3(r,0,0), new THREE.Vector3(-r,0,0), new THREE.Vector3(0,r,0), new THREE.Vector3(0,-r,0), new THREE.Vector3(0,0,r), new THREE.Vector3(0,0,-r)].forEach(pos => {
                        const water = createWaterMolecule(); group.add(water); water.position.copy(pos);
                        const dummy = new THREE.Object3D(); dummy.position.copy(pos); dummy.lookAt(0,0,0);
                        water.quaternion.copy(dummy.quaternion); if(isCation) water.rotateY(Math.PI);
                    });
                    
                    // 将说明文字直接添加到 demoGroup，而不是添加到旋转的 ion group 中
                    const labelSprite = createTextSprite(isCation ? "阳离子(氧端朝内)" : "阴离子(氢端朝内)", 48, 2.5);
                    labelSprite.position.set(xPos, -(r + 1.5), 0);
                    demoGroup.add(labelSprite);
                    
                } else {
                     const labelSprite = createTextSprite("氢氧根离子(无水合层)", 48, 2.5);
                     labelSprite.position.set(xPos, -(r + 1.5), 0);
                     demoGroup.add(labelSprite);
                }
                
                // 将离子组本身加入 demoGroup
                demoGroup.add(group);
                
                return group;
            };

            const ionCId = cfg.c || 'Na+';
            const ionAId = cfg.a || 'Cl-';
            // 创建离子时，它们内部会将自己和对应的静态标签放入 demoGroup
            createDemoIon(ionCId, defC, -4.5, true);
            createDemoIon(ionAId, defA, 4.5, false);
            
            updateStatusText(`【特写模式】：请仔细观察水分子极性！左侧阳离子吸引带负电的氧端(红)；右侧阴离子吸引带正电的氢端(白)。`, "text-indigo-300");
            camera.position.set(0, 0, 14); controls.target.set(0,0,0);
        }

        window.startIonizationAnimation = function() {
            if (animationMode === 'IONIZATION_PLAYING') return;
            animationMode = 'IONIZATION_PLAYING';
            
            const board = document.getElementById('equation-board');
            board.classList.remove('hidden');
            board.classList.remove('border-t-cyan-400', 'shadow-[0_0_30px_rgba(34,211,238,0.2)]');
            board.classList.add('border-t-purple-500', 'shadow-[0_0_30px_rgba(168,85,247,0.2)]');
            
            const wrapper = document.getElementById('eq-content-wrapper');
            wrapper.style.maxHeight = '600px'; wrapper.style.opacity = '1';
            document.getElementById('eq-toggle-icon').style.transform = 'rotate(0deg)';
            
            const cfg = CONFIGS[currentSubstance];
            const eq1 = document.getElementById('eq-step1');
            const eq2 = document.getElementById('eq-step2');
            const eq3 = document.getElementById('eq-step3');
            
            let preEq = cfg.isMolecularCrystal ? '蔗糖分子' : cfg.name;
            eq1.innerHTML = `<span class="eq-part text-slate-400 font-bold">${preEq} 的电离方程式：</span>`;
            eq2.style.height = '0'; eq2.style.opacity = '0'; eq2.style.marginTop = '0';
            eq3.style.height = '0'; eq3.style.opacity = '0'; eq3.style.marginTop = '0';
            
            setTimeout(() => {
                if (cfg.isMolecularCrystal) {
                    updateStatusText("蔗糖分子完整地分散在水中，分子内部共价键未断裂，不产生自由移动的离子。", "text-purple-300 font-bold");
                    eq2.innerHTML = `<span class="eq-part text-slate-400">蔗糖 = 蔗糖 (非电解质，不发生电离)</span>`;
                } else if (cfg.type === 'weak_acid' || cfg.type === 'weak_base') {
                    if (cfg.type === 'weak_acid') updateStatusText("弱酸部分分子发生电离，共价键断裂产生 H⁺ 和 CH₃COO⁻。使用可逆符号 ⇌。", "text-blue-300 font-bold");
                    else updateStatusText("弱碱(如氨水)部分电离，产生 NH₄⁺ 和 OH⁻。使用可逆符号 ⇌。", "text-blue-300 font-bold");
                    eq2.innerHTML = cfg.ionEq;
                } else if (cfg.type === 'covalent') {
                    updateStatusText("强极性共价键在水分子作用下完全断裂，发生完全电离！", "text-cyan-300 font-bold");
                    eq2.innerHTML = cfg.ionEq;
                } else {
                    updateStatusText("水分子克服了强烈的离子键，微粒解离形成水合离子，能够完全自由移动！", "text-cyan-300 font-bold");
                    eq2.innerHTML = cfg.ionEq;
                }
                
                eq2.style.height = '36px';
                eq2.style.opacity = '1';
                eq2.style.marginTop = '12px';
            }, 300);
        }

        function resetSimulation(updateText = true) {
            if (currentMode === 'pure') animationMode = 'IDLE';
            else if (currentMode === 'mix') animationMode = 'REACTION_IDLE';
            else if (currentMode === 'ionization') animationMode = 'IONIZATION_IDLE';
            meltTemperature = 0; dissolveProgress = 0;
            bondsGroup.visible = true;
            
            maxRecordedCharge = 1; chartData.fill(0);
            updateEquationBoard(1);

            while(demoGroup.children.length > 0) demoGroup.remove(demoGroup.children[0]);
            if (isElectricFieldOn) toggleElectricField();
            ambientWater.forEach(wm => scene.remove(wm.group)); ambientWater = []; document.body.classList.remove('underwater');
            document.getElementById('bond-popup').classList.add('hidden');

            buildScene();
            camera.position.set(0, 8, 38); controls.target.set(0,0,0);
            
            if (updateText) {
                const cfg = CONFIGS[currentSubstance];
                if (currentMode === 'pure') {
                    if (cfg.isMolecularCrystal) {
                        updateStatusText(`当前状态：固态 ${cfg.name}。分子之间通过较弱的分子间作用力结合成晶体，不含自由离子，不导电。`, "text-slate-300");
                    } else {
                        updateStatusText(`当前状态：固态纯 ${cfg.name}。微粒被作用力束缚，无法自由移动，不导电。`, "text-slate-300");
                    }
                }
                else if (currentMode === 'mix') {
                    updateStatusText(`当前状态：左侧与右侧分别是完全电离的强电解质水溶液。它们以自由水合离子的形式存在，所以写方程式必须【拆】！点击 [抽离隔板] 进行混合。`, "text-slate-300");
                }
                else if (currentMode === 'ionization') {
                    updateStatusText(`当前状态：左右微观对比视图。左侧为【电离前】的晶格或分子，右侧为【电离后】的自由微粒。点击 [展开电离方程式] 学习书写。`, "text-slate-300");
                }
            }
        }

        function updateStatusText(text, colorClass) {
            const el = document.getElementById('status-text');
            if (el) {
                el.innerText = text;
                el.className = `text-[12px] leading-relaxed font-medium h-[4rem] overflow-y-auto custom-scrollbar pr-1 ${colorClass || 'text-slate-200'}`;
            }
        }

        function onPointerDown(event) {
            if (animationMode !== 'IDLE' || currentMode !== 'pure') return;
            mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1; mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bondHitMeshes);
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                const titleEl = document.getElementById('bond-popup-title');
                const descEl = document.getElementById('bond-popup-desc');
                const popupEl = document.getElementById('bond-popup');

                if (data.isWeak) {
                    titleEl.innerHTML = '<svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> 微观揭秘：分子间作用力';
                    titleEl.className = 'text-base font-bold text-purple-400 flex items-center gap-2 border-b border-slate-600/50 pb-2';
                    popupEl.style.borderColor = 'rgba(168, 85, 247, 0.5)';
                    popupEl.style.boxShadow = '0 0 50px rgba(168, 85, 247, 0.5)';
                    descEl.innerHTML = '你点击了淡紫色的连线，它代表着 <span class="text-purple-400 font-bold">分子间作用力（如范德华力/氢键）</span>。这种力量较弱，在溶解时容易被水分子破坏。但是分子内部的共价键非常牢固，整个分子会完好无损地进入水中，<span class="text-red-400 font-bold">不会产生自由移动的离子</span>，无法导电！';
                } else {
                    titleEl.innerHTML = '<svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 微观揭秘：坚固的离子键';
                    titleEl.className = 'text-base font-bold text-cyan-300 flex items-center gap-2 border-b border-slate-600/50 pb-2';
                    popupEl.style.borderColor = 'rgba(34, 211, 238, 0.5)';
                    popupEl.style.boxShadow = '0 0 50px rgba(34, 211, 238, 0.5)';
                    descEl.innerHTML = '你点击了淡蓝色的连线，它代表着 <span class="text-cyan-400 font-bold">静电引力（离子键）</span>。正是这种强大的束缚力导致固态晶体中的离子无法自由移动，从而无法导电。必须在水中溶解或高温熔融，才能打破晶格！';
                }

                popupEl.classList.remove('hidden'); popupEl.classList.add('flex');
            }
        }
        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        window.onload = init;
    </script>
</body>
