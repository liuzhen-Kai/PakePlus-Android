<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电解质与离子反应微观实验室 - 终极整合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { 
            margin: 0; overflow: hidden; background-color: #0f172a; 
            color: white; font-family: 'Inter', system-ui, sans-serif; 
            transition: background-color 2s ease; user-select: none;
        }
        body.underwater { background-color: #082f49; } 
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        canvas { touch-action: none; outline: none; display: block; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .tab-btn { opacity: 0.5; transition: all 0.3s; border-bottom: 2px solid transparent; }
        .tab-btn.active { opacity: 1; font-weight: bold; border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        
        .sub-btn { transition: all 0.2s; border: 1px solid transparent; }
        .sub-btn.active { background: #2563eb; color: white; border-color: #60a5fa; box-shadow: 0 0 10px rgba(59,130,246,0.5); }

        .eq-transition { transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .spectator-crossed {
            position: relative;
            color: #ef4444; 
            opacity: 0.4;
        }
        .spectator-crossed::after {
            content: '';
            position: absolute;
            left: -10%; top: 50%; width: 120%; height: 2px;
            background-color: #ef4444;
            transform: rotate(-15deg);
            box-shadow: 0 0 8px #ef4444;
            animation: slash 0.5s ease-out forwards;
        }
        @keyframes slash {
            0% { width: 0; opacity: 1; }
            100% { width: 120%; opacity: 1; }
        }
        .eq-part { display: inline-block; padding: 0 4px; }
        
        #chartCanvas { width: 100%; height: 60px; margin-top: 10px; }
    </style>
</head>
<body>
    
    <div id="canvas-container"></div>

    <!-- 动态离子方程式推演板 (已放大体积，增强可读性，保留拉伸效果) -->
    <div id="equation-board" class="hidden absolute top-6 left-6 z-20 glass-panel px-6 py-4 rounded-2xl flex-col border-t-4 border-t-cyan-400 shadow-[0_0_30px_rgba(34,211,238,0.2)] min-w-[450px] max-w-[650px] transition-all duration-300">
        <div class="flex items-center justify-between cursor-pointer group" onclick="toggleEquationBoard()">
            <div class="text-[14px] text-cyan-300 font-bold uppercase tracking-widest flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                离子方程式动态推演面板
            </div>
            <div id="eq-toggle-icon" class="text-cyan-400 transform transition-transform duration-300 text-lg">▼</div>
        </div>
        <div id="eq-content-wrapper" class="overflow-hidden transition-all duration-500 max-h-[600px] opacity-100 pointer-events-none">
            <!-- 字号全面加大 -->
            <div id="eq-step1" class="text-[17px] font-mono font-bold text-white eq-transition text-center leading-relaxed mt-4"></div>
            <div id="eq-step2" class="text-[15px] font-mono font-bold text-blue-300 eq-transition text-center h-0 opacity-0 overflow-hidden mt-0 leading-relaxed"></div>
            <div id="eq-step3" class="text-[19px] font-mono font-bold text-green-400 eq-transition text-center h-0 opacity-0 overflow-hidden mt-0 border-t border-slate-700/50 pt-3 leading-relaxed"></div>
        </div>
    </div>

    <!-- 动态电离方程式写板 (新增：纯净物模式专用) -->
    <div id="ionization-board" class="hidden absolute top-6 left-6 z-20 glass-panel px-6 py-4 rounded-2xl flex-col border-t-4 border-t-purple-500 shadow-[0_0_30px_rgba(168,85,247,0.2)] min-w-[450px] max-w-[650px] transition-all duration-300">
        <div class="flex items-center justify-between cursor-pointer group" onclick="toggleIonizationBoard()">
            <div class="text-[14px] text-purple-300 font-bold uppercase tracking-widest flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                电离方程式
            </div>
            <div id="ion-toggle-icon" class="text-purple-400 transform transition-transform duration-300 text-lg" style="transform: rotate(-90deg);">▼</div>
        </div>
        <!-- 容器修改为允许交互的嵌套结构 -->
        <div id="ion-content-wrapper" class="overflow-hidden transition-all duration-500 max-h-[0px] opacity-0">
            <!-- 第一部分：微观电离过程展示 -->
            <div id="ion-micro-view" class="flex items-center justify-between w-full mt-4 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 shadow-inner">
                <!-- Left: 溶解前 -->
                <div id="micro-left" class="flex flex-col items-center w-[30%]"></div>
                <!-- Middle: 过程箭头 -->
                <div class="flex flex-col items-center w-[20%]">
                    <span class="text-[10px] text-slate-400 mb-1">电离</span>
                    <span class="text-purple-400 font-bold text-2xl animate-pulse leading-none">➔</span>
                </div>
                <!-- Right: 溶解后 -->
                <div id="micro-right" class="flex justify-center w-[50%]"></div>
            </div>

            <!-- 按钮：展开符号表征 -->
            <button id="btn-reveal-symbolic" onclick="revealSymbolicEquation()" class="mt-4 w-full py-2 bg-gradient-to-r from-purple-600/20 to-pink-600/20 hover:from-purple-600/40 hover:to-pink-600/40 text-purple-200 font-bold tracking-widest text-sm rounded-lg transition-all border border-purple-500/30 shadow-[0_0_15px_rgba(168,85,247,0.15)] cursor-pointer">
                点击展开符号表征
            </button>

            <!-- 第二部分：符号表征 -->
            <div id="ion-eq-text" class="text-[20px] font-mono font-bold text-white eq-transition text-center leading-relaxed h-0 opacity-0 overflow-hidden mt-0"></div>
        </div>
    </div>

    <!-- 顶部提示浮层 -->
    <div class="hidden md:flex absolute top-6 left-1/2 transform -translate-x-1/2 z-10 glass-panel px-5 py-2.5 rounded-full items-center gap-2 text-sm text-slate-300 shadow-lg pointer-events-none">
        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
        左键拖动旋转视角，滚轮缩放，右键平移
    </div>

    <!-- 底部可弹降工作台 (Dock) -->
    <!-- 负责水平居中的外壳 -->
    <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 z-30 w-[96%] max-w-5xl pointer-events-none">
        <!-- 负责垂直滑动的容器 -->
        <div id="bottom-slide-container" class="flex flex-col items-center transition-transform duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]" style="transform: translateY(0px);">
            
            <!-- 呼出/隐藏 把手 -->
            <button onclick="toggleBottomPanel()" class="glass-panel px-8 py-1.5 rounded-t-xl border-b-0 border-cyan-500/30 text-cyan-400 hover:text-white flex items-center gap-2 cursor-pointer pointer-events-auto transition-colors shadow-[0_-5px_20px_rgba(0,0,0,0.3)] bg-slate-900/90 hover:bg-slate-800">
                <span id="bottom-toggle-icon" class="text-[10px] transform transition-transform duration-300">▼</span>
                <span id="bottom-toggle-text" class="text-[12px] font-bold tracking-widest uppercase">收起工作台</span>
            </button>

            <!-- 实际操作面板 (去掉了底边圆角，使其贴合屏幕底部，间距更加紧凑) -->
            <div id="panel-bottom" class="glass-panel w-full p-3 md:p-4 rounded-t-2xl rounded-b-none flex flex-col md:flex-row gap-3 shadow-[0_-10px_40px_rgba(0,0,0,0.6)] pointer-events-auto border-b-0 pb-6 bg-slate-900/80">
                
                <!-- 左侧：模式切换与物质选择 -->
                <div class="flex flex-col w-full md:w-[45%] border-r border-slate-700/50 pr-0 md:pr-3">
                    <div class="flex items-end justify-between mb-2 border-b border-slate-700/50 pb-1">
                        <div>
                            <h1 class="text-lg font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300 tracking-tight leading-none">电解质反应实验台</h1>
                        </div>
                        <div class="flex gap-3 text-[13px] font-medium text-slate-400">
                            <button class="tab-btn active pb-1" onclick="switchTab('pure')">纯净物探索</button>
                            <button class="tab-btn pb-1" onclick="switchTab('mix')">溶液混合反应</button>
                            <button class="tab-btn pb-1 text-purple-300 border-purple-400" onclick="switchTab('ionization')">电离微观解析</button>
                        </div>
                    </div>

                    <!-- 纯净物列表 (更加紧凑) -->
                    <div id="grid-pure" class="grid grid-cols-3 md:grid-cols-4 gap-1.5 mt-1">
                        <button id="btn-sub-NaCl" class="sub-btn active py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('NaCl')">NaCl(易溶)</button>
                        <button id="btn-sub-CuSO4" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('CuSO4')">CuSO₄(易溶)</button>
                        <button id="btn-sub-BaOH2" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('BaOH2')">Ba(OH)₂(强碱)</button>
                        <button id="btn-sub-BaSO4" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('BaSO4')">BaSO₄(难溶)</button>
                        <button id="btn-sub-HCl" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('HCl')">HCl(共价)</button>
                        <button id="btn-sub-NH3" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('NH3')">NH₃(弱碱)</button>
                        <button id="btn-sub-Na2SO4" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('Na2SO4')">Na₂SO₄(易溶)</button>
                        <button id="btn-sub-KNO3" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium" onclick="changeSubstance('KNO3')">KNO₃(易溶)</button>
                        <button id="btn-sub-CH3COOH" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium border border-blue-400/30" onclick="changeSubstance('CH3COOH')">CH₃COOH(弱酸)</button>
                        <button id="btn-sub-H2O" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium border border-cyan-500/20" onclick="changeSubstance('H2O')">H₂O(纯水)</button>
                        <button id="btn-sub-Sucrose" class="sub-btn py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium border border-purple-500/20" onclick="changeSubstance('Sucrose')">蔗糖(非电解质)</button>
                    </div>

                    <!-- 混合反应列表 -->
                    <div id="grid-mix" class="hidden grid grid-cols-1 gap-1.5 mt-1 h-[80px] overflow-y-auto custom-scrollbar pr-1">
                        <button id="btn-sub-Mix1" class="sub-btn py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm font-medium flex items-center justify-between px-3" onclick="changeSubstance('Mix1')">
                            <span>NaCl + CuSO₄</span> <span class="text-xs text-slate-500 bg-slate-900 px-1.5 rounded">无反应共存</span>
                        </button>
                        <button id="btn-sub-Mix3" class="sub-btn py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm font-medium flex items-center justify-between px-3" onclick="changeSubstance('Mix3')">
                            <span>BaCl₂ + Na₂SO₄</span> <span class="text-xs text-yellow-400 bg-yellow-400/10 px-1.5 rounded border border-yellow-400/30">单沉淀(滤除旁观)</span>
                        </button>
                        <button id="btn-sub-Mix2" class="sub-btn py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm font-medium flex items-center justify-between px-3" onclick="changeSubstance('Mix2')">
                            <span>CuSO₄ + Ba(OH)₂</span> <span class="text-xs text-orange-400 bg-orange-400/10 px-1.5 rounded border border-orange-400/30">双沉淀生成</span>
                        </button>
                    </div>
                </div>

                <!-- 中间：操作按钮区 -->
                <div class="flex flex-col gap-2 w-full md:w-[25%] justify-center border-r border-slate-700/50 pr-0 md:pr-3">
                    <div id="actions-pure" class="flex flex-col gap-1.5">
                        <button id="btn-dissolve" class="w-full py-1.5 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 text-white rounded-lg font-semibold transition-all shadow text-sm">投入水中 (溶解)</button>
                        <button id="btn-melt" class="w-full py-1.5 bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 text-white rounded-lg font-semibold transition-all shadow text-sm">高温加热 (熔融)</button>
                    </div>
                    <div id="actions-mix" class="hidden flex flex-col gap-1.5">
                        <button id="btn-mix-action" class="w-full py-2 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 text-white rounded-lg font-bold transition-all shadow-lg text-[15px] animate-pulse shadow-emerald-500/30">
                            ⬆️ 抽离隔板 (混合)
                        </button>
                    </div>
                    <div id="actions-ionization" class="hidden flex flex-col gap-1.5">
                        <button id="btn-play-ionization" onclick="startIonizationAnimation()" class="w-full py-2 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 text-white rounded-lg font-bold transition-all shadow-lg text-[15px] animate-pulse shadow-purple-500/30">
                            📝 展开电离方程式
                        </button>
                    </div>

                    <button id="btn-efield" class="w-full py-1.5 bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-500 text-white rounded-lg font-bold transition-all shadow text-sm border border-yellow-400/30">外加电场 (测导电)</button>
                    
                    <div class="grid grid-cols-2 gap-1.5 mt-0.5">
                        <button id="btn-reset" class="py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded font-medium text-[11px]">恢复原态</button>
                        <button id="btn-demo" class="py-1 bg-indigo-900/80 hover:bg-indigo-800 text-indigo-200 rounded font-medium text-[11px] border border-indigo-700/50">水合特写</button>
                        <button id="btn-toggle-signs" class="col-span-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-medium text-[11px] border border-slate-600">显示/隐藏正负号</button>
                    </div>
                </div>

                <!-- 右侧：动态讲解 -->
                <div class="flex flex-col w-full md:w-[30%] bg-slate-950/60 p-3 rounded-xl border border-slate-700/50 justify-center">
                    <div id="status-text" class="text-[13px] leading-relaxed text-slate-200 font-medium h-[4rem] overflow-y-auto custom-scrollbar pr-1">
                        当前状态：固态离子晶体。阴阳离子被静电引力牢牢束缚在晶格中，距离固定，无法自由移动，绝不导电。
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 电流表 UI 与实时导电率曲线 -->
    <div id="ammeter-ui" class="hidden absolute top-6 right-6 z-10 glass-panel p-4 rounded-xl flex flex-col items-center border-t-4 border-t-yellow-500 shadow-xl pointer-events-none w-48">
        <h3 class="text-[11px] font-bold text-slate-200 mb-1 uppercase tracking-wider flex items-center justify-between w-full">
            <span>面板电流表</span>
            <span id="charge-value" class="text-yellow-400 font-mono">0.0A</span>
        </h3>
        <div class="relative w-32 h-14 overflow-hidden border-b border-slate-500 mb-2">
            <div class="absolute bottom-0 left-1/2 w-1 h-2 bg-slate-400 transform -translate-x-1/2"></div>
            <div class="absolute bottom-0 left-1/4 w-0.5 h-1.5 bg-slate-500 transform -translate-x-1/2 rotate-[-45deg] origin-bottom"></div>
            <div class="absolute bottom-0 left-3/4 w-0.5 h-1.5 bg-slate-500 transform -translate-x-1/2 rotate-[45deg] origin-bottom"></div>
            <div id="ammeter-needle" class="absolute bottom-0 left-1/2 w-[3px] h-12 bg-gradient-to-t from-red-600 to-red-400 origin-bottom transition-transform duration-100 transform rotate-0 shadow-lg shadow-red-500/50" style="margin-left: -1.5px;"></div>
            <div class="absolute bottom-0 left-1/2 w-2 h-2 bg-slate-300 rounded-full transform -translate-x-1/2 translate-y-1/2 z-10"></div>
        </div>
        <div class="w-full pt-2 border-t border-slate-700/50">
            <h3 class="text-[9px] text-slate-400 mb-1 text-center">溶液导电性 (离子浓度) 曲线</h3>
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>
    
    <!-- 悬浮图例面板 (固定在右下角) -->
    <div id="floating-legend" class="absolute bottom-[20vh] md:bottom-28 right-4 md:right-6 z-20 glass-panel p-4 rounded-xl flex flex-col pointer-events-none min-w-[140px] shadow-2xl border-t-4 border-t-indigo-500 transition-all duration-500">
        <div class="text-[12px] text-indigo-300 font-bold border-b border-slate-600/50 pb-2 mb-3 flex items-center gap-2 uppercase tracking-widest">
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            微粒图例
        </div>
        <div id="legend-container" class="flex flex-col gap-3 text-[11px] text-slate-200">
            <!-- 动态图例生成 -->
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="bond-popup" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass-panel p-6 rounded-2xl w-[90%] md:w-[28rem] flex-col gap-3 border-2 border-cyan-400/50 shadow-[0_0_50px_rgba(34,211,238,0.5)] z-[100] pointer-events-auto">
        <h3 id="bond-popup-title" class="text-base font-bold text-cyan-300 flex items-center gap-2 border-b border-slate-600/50 pb-2">
            <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            微观揭秘：坚固的离子键
        </h3>
        <p id="bond-popup-desc" class="text-[14px] text-slate-200 leading-relaxed mt-1">
            你点击了淡蓝色的连线，它代表着 <span class="text-cyan-400 font-bold">静电引力（离子键）</span>。正是这种强大的束缚力导致固态晶体中的离子无法自由移动，从而无法导电。必须在水中溶解或高温熔融，才能打破晶格！
        </p>
        <button onclick="document.getElementById('bond-popup').classList.add('hidden')" class="mt-2 w-full py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white rounded-lg font-bold shadow">我知道了</button>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let ions = []; 
        let ambientWater = []; 
        let crystalBonds = []; 
        let bondHitMeshes = []; 
        let bondsGroup = new THREE.Group(); 
        let demoGroup = new THREE.Group(); 
        let attractionLines;
        let extraSceneObjects = []; // 新增：用于跟踪并在重置时清理额外的UI文字标签
        
        let animationMode = 'IDLE'; 
        let meltTemperature = 0;
        let dissolveProgress = 0;
        const clock = new THREE.Clock();

        let isElectricFieldOn = false;
        let electrodesGroup;
        let glassTank, partitionMesh;
        let showSigns = true;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const chartData = new Array(80).fill(0);
        let maxRecordedCharge = 1;

        const ION_TYPES = {
            'Na+': { radius: 0.45, color: 0x9333ea, sign: '+', name: 'Na⁺(钠离子)', type: 'Cation', charge: 1 },

        function createTextSprite(text, fontSize = 64, baseScale = 1.5) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${fontSize}px "Inter", sans-serif`;
            const textWidth = ctx.measureText(text).width;
            canvas.width = Math.max(128, textWidth + 80); 
            canvas.height = 128; 
            ctx.font = `bold ${fontSize}px "Inter", sans-serif`;
            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 8;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false, transparent: true }));
            sprite.scale.set(baseScale * (canvas.width / canvas.height), baseScale, baseScale);
            return sprite;
        }

        function createSucroseMesh() {
            const group = new THREE.Group();
            const cMat = new THREE.MeshPhysicalMaterial({ color: 0x444444, roughness: 0.8 });
            const oMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 });
            const hMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
            
            const addAtom = (t, x, y, z) => {
                let r = 0.22, m = cMat;
                if(t === 'O') { r = 0.20; m = oMat; }
                if(t === 'H') { r = 0.14; m = hMat; }
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 16), m);
                mesh.position.set(x, y, z);
                group.add(mesh);
            };
            
            addAtom('C', -0.3, 0.2, 0); addAtom('C', 0.3, 0.2, 0.1);
            addAtom('C', -0.5, -0.2, 0.3); addAtom('C', 0.5, -0.3, -0.2);
            addAtom('C', -0.2, -0.6, 0.4); addAtom('C', 0.2, -0.6, -0.3);
            addAtom('C', -0.6, 0.5, -0.2); addAtom('C', 0.4, 0.6, 0.3);
            addAtom('C', -0.8, 0.1, -0.4); addAtom('C', 0.7, 0.1, 0.5);
            addAtom('C', -0.1, 0.6, 0.4); addAtom('C', 0.1, 0.7, -0.2);
            addAtom('O', -0.9, 0.4, 0.1); addAtom('O', 0.9, 0.4, -0.1);
            addAtom('O', -0.4, -0.9, 0.5); addAtom('O', 0.4, -0.9, -0.5);
            addAtom('O', -1.1, -0.2, -0.2); addAtom('O', 1.1, -0.2, 0.4);
            addAtom('O', 0, 1.0, 0); addAtom('O', -0.6, 0.9, -0.3);
            addAtom('O', 0.6, 0.9, 0.4); addAtom('O', 0, 0, 0.4); 
            addAtom('O', 0, 0, -0.4);
            for(let i=0; i<22; i++) {
                const phi = Math.acos(1 - 2 * (i + 0.5) / 22);
                const theta = Math.PI * (1 + Math.sqrt(5)) * i;
                const r = 0.65 + (i % 3) * 0.05;
                addAtom('H', r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            }

            const sprite = createTextSprite("C₁₂H₂₂O₁₁", 50, 1.8);
            sprite.position.y = 1.1;
            sprite.isSignSprite = true; 
            sprite.visible = showSigns;
            group.add(sprite);

            return group;
        }

        function updateLegend() {
            const container = document.getElementById('legend-container');
            container.innerHTML = '';
            const cfg = CONFIGS[currentSubstance];
            
            const addLegendItem = (ionId) => {
                const def = ION_TYPES[ionId];
                container.innerHTML += `<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.3)]" style="background-color: #${def.color.toString(16).padStart(6,'0')}"></div><span class="text-[11px] font-medium tracking-wide">${def.name}</span></div>`;
            };

            if (cfg.mode === 'pure') {
                if (cfg.isMolecularCrystal) {
                    container.innerHTML += `<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-slate-600 shadow-[0_0_8px_rgba(255,255,255,0.3)]"></div><span class="text-[11px] font-medium tracking-wide">蔗糖分子 (非电解质)</span></div>`;
                } else {
                    if (cfg.c) addLegendItem(cfg.c);
                    if (cfg.a) addLegendItem(cfg.a);
                    if (cfg.type === 'covalent') { addLegendItem('H+'); addLegendItem('Cl-'); }
                    if (cfg.type === 'weak_base') { addLegendItem('NH4+'); addLegendItem('OH-'); }
                    if (cfg.type === 'weak_acid') { addLegendItem('H+'); addLegendItem('CH3COO-'); }
                    if (cfg.type === 'water') { addLegendItem('H+'); addLegendItem('OH-'); }
                }
            } else {
                const uniqueIons = new Set();
                cfg.left.forEach(i => uniqueIons.add(i.id));
                cfg.right.forEach(i => uniqueIons.add(i.id));
                uniqueIons.forEach(id => addLegendItem(id));
            }
            
            container.innerHTML += `
                <div class="flex items-center gap-2 opacity-80 mt-1 pt-2 border-t border-slate-700/50">
                    <div class="flex items-center transform scale-75"><div class="w-2.5 h-2.5 rounded-full bg-slate-100 relative left-1 z-10 shadow-[0_0_5px_#fff]"></div><div class="w-4 h-4 rounded-full bg-red-500 z-0 shadow-[0_0_5px_#f00]"></div><div class="w-2.5 h-2.5 rounded-full bg-slate-100 relative right-1 z-10 shadow-[0_0_5px_#fff]"></div></div>
                    <span class="text-[11px] font-medium tracking-wide">H₂O分子</span>
                </div>
            `;
        }

        function buildScene() {
            ions.forEach(ion => scene.remove(ion.group)); ions = [];
            crystalBonds = []; bondHitMeshes = [];
            while(bondsGroup.children.length > 0) bondsGroup.remove(bondsGroup.children[0]);
            attractionLines.geometry.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
            
            // 新增：清理上一模式遗留的文字标签（如：水分子作用 ➔）
            extraSceneObjects.forEach(obj => scene.remove(obj));
            extraSceneObjects = [];
            
            const cfg = CONFIGS[currentSubstance];
            
            if (currentMode === 'pure') {
                partitionMesh.visible = false;
                if (!cfg.type) {
                    const offset = (cfg.latticeSize - 1) * cfg.spacing / 2;
                    const centerIdx = (cfg.latticeSize - 1) / 2;

                    for (let x = 0; x < cfg.latticeSize; x++) {
                        for (let y = 0; y < cfg.latticeSize; y++) {
                            for (let z = 0; z < cfg.latticeSize; z++) {
                                let group;
                                let isNonElectrolyte = false;
                                let radius = 0.5;
                                let ionId = 'Sucrose';

                                if (cfg.isMolecularCrystal) {
                                    group = createSucroseMesh();
                                    isNonElectrolyte = true;
                                    radius = 1.0; 
                                } else {
                                    const isCation = (x + y + z) % 2 === 0;
                                    ionId = isCation ? cfg.c : cfg.a;
                                    group = createIonMesh(ionId);
                                    radius = ION_TYPES[ionId].radius;
                                }
                                
                                const posX = x * cfg.spacing - offset; const posY = y * cfg.spacing - offset; const posZ = z * cfg.spacing - offset;
                                group.position.set(posX, posY, posZ); scene.add(group);

                                ions.push({
                                    id: ionId, def: cfg.isMolecularCrystal ? { type: 'NonElectrolyte', radius: radius } : ION_TYPES[ionId], 
                                    group: group, signSprite: cfg.isMolecularCrystal ? group.children[group.children.length-1] : group.children.find(c => c.isSignSprite),
                                    basePos: new THREE.Vector3(posX, posY, posZ), velocity: new THREE.Vector3(),
                                    isDetached: false, shellGathering: false, hydrationShell: [], hydrationShellInfo: [],
                                    gridDist: Math.abs(x - centerIdx) + Math.abs(y - centerIdx) + Math.abs(z - centerIdx),
                                    isNonElectrolyte: isNonElectrolyte
                                });
                            }
                        }
                    }
                    ions.sort((a, b) => b.gridDist - a.gridDist);
                    let dissolvedCount = 0;
                    ions.forEach(ion => { ion.isDissolvable = (dissolvedCount++ < cfg.maxDissolve); });
                    
                    for(let i=0; i<ions.length; i++) {
                        for(let j=i+1; j<ions.length; j++) {
                            if(Math.abs(ions[i].basePos.distanceTo(ions[j].basePos) - cfg.spacing) < 0.1) {
                                if (!cfg.isMolecularCrystal && ions[i].def.type === ions[j].def.type) continue; 

                                const bGroup = new THREE.Group();
                                const isWeak = cfg.isMolecularCrystal;
                                const bMesh = new THREE.Mesh(
                                    new THREE.CylinderGeometry(isWeak ? 0.06 : 0.12, isWeak ? 0.06 : 0.12, cfg.spacing, 8), 
                                    isWeak ? weakBondMat.clone() : bondMat.clone()
                                );
                                const hitMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, cfg.spacing, 8), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
                                hitMesh.userData = { isBond: true, isWeak: isWeak, originalMesh: bMesh };
                                bGroup.position.copy(new THREE.Vector3().addVectors(ions[i].basePos, ions[j].basePos).multiplyScalar(0.5));
                                bGroup.lookAt(ions[j].basePos); bMesh.rotation.set(Math.PI/2, 0, 0); hitMesh.rotation.set(Math.PI/2, 0, 0);
                                bGroup.add(bMesh, hitMesh); bondsGroup.add(bGroup);
                                crystalBonds.push({ mesh: bMesh }); bondHitMeshes.push(hitMesh);
                            }
                        }
                    }
                } else {
                    let moleculeCount = cfg.type === 'weak_acid' ? 50 : (cfg.type === 'water' ? 60 : 27); // 弱酸和水特意生成多一点来体现“极少部分电离”
                        for (let i = 0; i < moleculeCount; i++) {
                            let group;
                            if (cfg.type === 'covalent') group = createHCl();
                            else if (cfg.type === 'weak_acid') group = createCH3COOH();
                            else if (cfg.type === 'water') { group = createWaterMolecule(); group.scale.set(1.5, 1.5, 1.5); }
                            else group = createNH3();
                            const posX = (Math.random()-0.5)*16; const posY = (Math.random()-0.5)*10; const posZ = (Math.random()-0.5)*10;
                            group.position.set(posX, posY, posZ);
                            group.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                            scene.add(group);
                            ions.push({
                                id: cfg.type === 'weak_acid' ? 'CH3COOH' : (cfg.type === 'water' ? 'H2O' : (cfg.type === 'covalent' ? 'HCl' : 'NH3')), 
                                group: group, basePos: group.position.clone(),
                                velocity: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1),
                                isDetached: true, isMolecule: true, shellGathering: false, hydrationShell: [], hydrationShellInfo: []
                            });
                        }
                    }
            } else if (currentMode === 'mix') {
                partitionMesh.visible = true; partitionMesh.position.y = 1;
                document.body.classList.add('underwater');
                
                const spawnIons = (list, minX, maxX) => {
                    list.forEach(item => {
                        for(let i=0; i<item.count; i++) {
                            const group = createIonMesh(item.id);
                            const posX = minX + Math.random()*(maxX - minX);
                            const posY = -8 + Math.random()*16;
                            const posZ = -6 + Math.random()*12;
                            group.position.set(posX, posY, posZ);
                            scene.add(group);
                            
                            const def = ION_TYPES[item.id];
                            const radius = def.radius + 0.35;
                            const shell = [];
                            if (item.id !== 'OH-') {
                                [new THREE.Vector3(radius,0,0), new THREE.Vector3(-radius,0,0), new THREE.Vector3(0,radius,0), new THREE.Vector3(0,-radius,0)].forEach(localPos => {
                                    const water = createWaterMolecule();
                                    group.add(water); water.position.copy(localPos);
                                    const dummy = new THREE.Object3D(); dummy.position.copy(localPos); dummy.lookAt(0,0,0);
                                    water.quaternion.copy(dummy.quaternion);
                                    if (def.type === 'Cation') water.rotateY(Math.PI);
                                    shell.push(water);
                                });
                            }

                            ions.push({
                                id: item.id, def: def, group: group, signSprite: group.children.find(c=>c.isSignSprite),
                                basePos: new THREE.Vector3(posX, posY, posZ),
                                velocity: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1),
                                isDetached: true, hydrationShell: shell, isLocked: false, isNonElectrolyte: false
                            });
                        }
                    });
                };
                
                spawnIons(cfg.left, -15, -1.5);
                spawnIons(cfg.right, 1.5, 15);
            } else if (currentMode === 'ionization') {
                partitionMesh.visible = false;
                document.body.classList.add('underwater');
                
                const beforeX = -7, afterX = 7;

                // 中间箭头与标签 (新增：将其推入 extraSceneObjects 以便统一清理)
                const arrow = createTextSprite("水分子作用 ➔", 50, 2);
                arrow.position.set(0, 0, 0); arrow.material.color.setHex(0x22d3ee); scene.add(arrow); extraSceneObjects.push(arrow);
                
                const lblBefore = createTextSprite("【电离前】 晶格或分子", 40, 1.5);
                lblBefore.position.set(beforeX, -4, 0); lblBefore.material.color.setHex(0x94a3b8); scene.add(lblBefore); extraSceneObjects.push(lblBefore);
                
                const lblAfter = createTextSprite("【电离后】 自由水合微粒", 40, 1.5);
                lblAfter.position.set(afterX, -4, 0); lblAfter.material.color.setHex(0x94a3b8); scene.add(lblAfter); extraSceneObjects.push(lblAfter);

                // --- 1. 构建电离前 (左侧) ---
                let beforeGroup = new THREE.Group();
                beforeGroup.position.set(beforeX, 0, 0);
                scene.add(beforeGroup);
                
                if (cfg.isMolecularCrystal || cfg.type === 'weak_acid' || cfg.type === 'covalent' || cfg.type === 'weak_base' || cfg.type === 'water') {
                    let unitGroup;
                    if (cfg.isMolecularCrystal) unitGroup = createSucroseMesh();
                    else if (cfg.type === 'covalent') unitGroup = createHCl();
                    else if (cfg.type === 'weak_acid') unitGroup = createCH3COOH();
                    else if (cfg.type === 'weak_base') unitGroup = createNH3();
                    else if (cfg.type === 'water') { unitGroup = createWaterMolecule(); unitGroup.scale.set(1.5, 1.5, 1.5); }
                    beforeGroup.add(unitGroup);
                    ions.push({ group: beforeGroup, basePos: new THREE.Vector3(beforeX,0,0), velocity: new THREE.Vector3(), isMolecule: true });
                } else {
                    // 【优化】：生成完整的微型晶格，取代原先单一的离子对
                    const offset = (cfg.latticeSize - 1) * cfg.spacing / 2;
                    let latticeNodes = [];
                    
                    for (let x = 0; x < cfg.latticeSize; x++) {
                        for (let y = 0; y < cfg.latticeSize; y++) {
                            for (let z = 0; z < cfg.latticeSize; z++) {
                                const isCation = (x + y + z) % 2 === 0;
                                const ionId = isCation ? cfg.c : cfg.a;
                                const ionMesh = createIonMesh(ionId);
                                
                                const posX = x * cfg.spacing - offset; 
                                const posY = y * cfg.spacing - offset; 
                                const posZ = z * cfg.spacing - offset;
                                ionMesh.position.set(posX, posY, posZ);
                                beforeGroup.add(ionMesh);
                                
                                latticeNodes.push({ mesh: ionMesh, type: ION_TYPES[ionId].type });
                            }
                        }
                    }
                    
                    // 为晶格内的相邻离子添加离子键
                    for (let i = 0; i < latticeNodes.length; i++) {
                        for (let j = i + 1; j < latticeNodes.length; j++) {
                            if (Math.abs(latticeNodes[i].mesh.position.distanceTo(latticeNodes[j].mesh.position) - cfg.spacing) < 0.1) {
                                if (latticeNodes[i].type !== latticeNodes[j].type) { // 确保是不同种电荷相连
                                    const bMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, cfg.spacing, 8), bondMat.clone());
                                    bMesh.position.copy(new THREE.Vector3().addVectors(latticeNodes[i].mesh.position, latticeNodes[j].mesh.position).multiplyScalar(0.5));
                                    bMesh.lookAt(latticeNodes[j].mesh.position); 
                                    bMesh.rotateX(Math.PI/2);
                                    beforeGroup.add(bMesh);
                                }
                            }
                        }
                    }
                    
                    beforeGroup.scale.set(0.6, 0.6, 0.6); // 缩小0.6倍，完美适应左侧半屏空间
                    ions.push({ group: beforeGroup, basePos: new THREE.Vector3(beforeX,0,0), velocity: new THREE.Vector3(), isUnit: true });
                }

                // --- 2. 构建电离后 (右侧) ---
                if (cfg.isMolecularCrystal) {
                    const afterGroup = createSucroseMesh();
                    afterGroup.position.set(afterX, 0, 0); scene.add(afterGroup);
                    ions.push({ group: afterGroup, basePos: new THREE.Vector3(afterX,0,0), velocity: new THREE.Vector3(), isMolecule: true });
                } else {
                    let cId = cfg.c || (cfg.type === 'weak_base' ? 'NH4+' : 'H+');
                    let aId = cfg.a || (cfg.type === 'covalent' ? 'Cl-' : (cfg.type === 'weak_acid' ? 'CH3COO-' : 'OH-'));
                    
                    const addHydratedIon = (id, isCation, offset) => {
                        const ion = createIonMesh(id);
                        ion.position.copy(new THREE.Vector3(afterX, 0, 0).add(offset));
                        scene.add(ion);
                        
                        if (id !== 'OH-') {
                            const r = ION_TYPES[id].radius + 0.35;
                            [new THREE.Vector3(r,0,0), new THREE.Vector3(-r,0,0), new THREE.Vector3(0,r,0), new THREE.Vector3(0,-r,0)].forEach(localPos => {
                                const water = createWaterMolecule();
                                ion.add(water); water.position.copy(localPos);
                                const dummy = new THREE.Object3D(); dummy.position.copy(localPos); dummy.lookAt(0,0,0);
                                water.quaternion.copy(dummy.quaternion);
                                if (isCation || id === 'NH4+') water.rotateY(Math.PI);
                            });
                        }
                        ions.push({ id: id, def: ION_TYPES[id], group: ion, basePos: ion.position.clone(), velocity: new THREE.Vector3(), isDetached: true, jiggle: true });
                    };

                    addHydratedIon(cId, true, new THREE.Vector3(-1.5, 1.5, 0));
                    addHydratedIon(aId, false, new THREE.Vector3(1.5, -1.5, 0));
                    
                    if (currentSubstance === 'BaOH2') {
                        addHydratedIon(cfg.a, false, new THREE.Vector3(1.5, 1.5, 0));
                    } else if (currentSubstance === 'Na2SO4') {
                        addHydratedIon(cfg.c, true, new THREE.Vector3(-1.5, -1.5, 0));
                    }
                }
                
                spawnAmbientWater(12);
            }
        }

        function updateChart(currentCharge) {
            const targetCharge = currentCharge;
            const lastCharge = chartData[chartData.length - 1];
            const smoothedCharge = lastCharge + (targetCharge - lastCharge) * 0.1;
            
            chartData.shift();
            chartData.push(smoothedCharge);
            if (smoothedCharge > maxRecordedCharge) maxRecordedCharge = smoothedCharge * 1.2;

            const canvas = document.getElementById('chartCanvas');
            if(canvas) {
                const ctx = canvas.getContext('2d');
                const w = canvas.width = canvas.offsetWidth;
                const h = canvas.height = canvas.offsetHeight;
                
                ctx.clearRect(0, 0, w, h);
                
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();

                ctx.beginPath();
                ctx.strokeStyle = '#38bdf8'; 
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                for(let i=0; i<chartData.length; i++) {
                    const x = (i / (chartData.length - 1)) * w;
                    const y = h - (chartData[i] / Math.max(maxRecordedCharge, 1)) * h * 0.9;
                    if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();

                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, 'rgba(56,189,248,0.4)');
                gradient.addColorStop(1, 'rgba(56,189,248,0.0)');
                ctx.lineTo(w, h); ctx.lineTo(0, h);
                ctx.fillStyle = gradient; ctx.fill();
            }

            const needle = document.getElementById('ammeter-needle');
            const chargeTxt = document.getElementById('charge-value');
            if (needle && chargeTxt) {
                if (isElectricFieldOn && smoothedCharge > 5) {
                    const ratio = Math.min(smoothedCharge / 100, 1.0); 
                    const baseAngle = 15 + ratio * 45; 
                    needle.style.transform = `rotate(${baseAngle + (Math.random()-0.5)*3}deg)`;
                    chargeTxt.innerText = (ratio * 2.5).toFixed(2) + 'A';
                    chargeTxt.className = 'text-green-400 font-mono';
                } else { 
                    needle.style.transform = 'rotate(0deg)'; 
                    chargeTxt.innerText = '0.00A';
                    chargeTxt.className = 'text-slate-500 font-mono';
                }
            }
        }
